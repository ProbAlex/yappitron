# Home server stack: Caddy (TLS + web app) -> gateway -> Postgres.
# Run from the repo root:  docker compose -f deploy/home/compose.yml --env-file .env up -d --build
#
# No-log posture: Postgres statement/connection logging off, no access logs anywhere, and
# container logs are tiny and rotated (errors only; no identifiers are ever logged).

x-logging: &logging
  driver: json-file
  options:
    max-size: "1m"
    max-file: "2"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_messages=error
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  gateway:
    build:
      context: ../..
      dockerfile: crates/yap-server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      YAP_BIND: ${YAP_BIND}
      YAP_DOMAIN: ${YAP_DOMAIN}
      YAP_SERVER_SECRET: ${YAP_SERVER_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      RUST_LOG: warn
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      YAP_DOMAIN: ${YAP_DOMAIN}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../app/build/web:/srv/web:ro
      - caddy_data:/data
    depends_on:
      - gateway
    logging: *logging

volumes:
  pgdata:
  caddy_data:
