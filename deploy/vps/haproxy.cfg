# VPS edge: TCP passthrough by SNI to the home server over WireGuard.
# TLS is NOT terminated here, so the VPS only ever sees encrypted bytes.
#
# NO LOGGING: there is intentionally no `log` directive anywhere in this file.

global
	maxconn 20000

defaults
	mode tcp
	timeout connect 5s
	timeout client  1h
	timeout server  1h

frontend yap_tls
	bind :443
	tcp-request inspect-delay 5s
	tcp-request content accept if { req_ssl_hello_type 1 }
	use_backend home if { req_ssl_sni -i yap.leafyserver.tech }
	default_backend nowhere

backend home
	balance leastconn
	# send-proxy-v2 hands the real client IP to Caddy (used for in-RAM rate limits only).
	# Add more `server` lines here as you add machines to the WireGuard network.
	server home1 10.77.0.2:443 send-proxy-v2 check

# Unknown hostnames get nothing.
backend nowhere
