[package]
name = "yap-wasm"
description = "wasm-bindgen binding over yap-core for the browser (Flutter web)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
yap-core = { path = "../yap-core" }
# Must match the wasm-bindgen CLI used to post-process the build (see justfile).
wasm-bindgen = "=0.2.130"
