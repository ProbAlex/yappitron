[workspace]
resolver = "3"
members = ["crates/yap-proto", "crates/yap-core", "crates/yap-ffi", "crates/yap-wasm", "crates/yap-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ProbAlex/yappitron"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
